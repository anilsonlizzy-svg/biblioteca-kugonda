<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Kugonda</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
      .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; }
      .livro { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
      .livro h3 { margin-top: 0; color: #0056b3; }
      .btn { display: inline-block; margin-top: 10px; padding: 10px 15px; background: #0056b3; color: white; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; width: 100%; text-align: center; box-sizing: border-box; }
      .btn[disabled] { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>📚 Biblioteca Kugonda</h1>
    <div class="container" id="livros-container">
        <p>Carregando livros...</p>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDWIzYfo-Dyydfp05rF9RaMw6MDhNb_uKE",
          authDomain: "kugonda-online.firebaseapp.com",
          projectId: "kugonda-online",
          storageBucket: "kugonda-online.firebasestorage.app",
          messagingSenderId: "197225463034",
          appId: "1:197225463034:web:05a199b1d6be8ed6355d43"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const container = document.getElementById('livros-container');

        db.collection("livros").get().then((querySnapshot) => {
            container.innerHTML = "";
            if(querySnapshot.empty) {
                container.innerHTML = "<p>Nenhum livro encontrado.</p>";
            }
            querySnapshot.forEach((doc) => {
                const livro = doc.data();
                container.innerHTML += `
                <div class="livro">
                    <h3>${livro.titulo || 'Sem título'}</h3>
                    <p><b>Classe:</b> ${livro.classe || '-'}</p>
                    <p><b>Disciplina:</b> ${livro.disciplina || '-'}</p>
                    <p><b>Autor:</b> ${livro.autor || '-'}</p>
                    ${livro.urlPdf? `<a href="${livro.urlPdf}" target="_blank" class="btn">Ler PDF</a>` : `<button class="btn" disabled>Sem PDF</button>`}
                </div>
                `;
            });
        }).catch((error) => {
            console.log("Erro: ", error);
            container.innerHTML = "<p>Erro ao carregar livros. Confere as regras do Firebase.</p>";
        });
    </script>

</body>
</html>
