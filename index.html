<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Kugonda</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #333; }
    .livro { background: white; padding: 15px; margin: 15px auto; border-radius: 8px; max-width: 600px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .livro h3 { margin: 0 0 5px 0; }
    .livro p { margin: 5px 0; color: #666; }
    .btn-ler { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    .btn-ler:hover { background: #0056b3; }
    .btn-sair { position: absolute; top: 20px; right: 20px; background: red; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }

    /* MODAL PDF */
    #pdfModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; }
    #pdfModal .conteudo { position: relative; width: 95%; height: 95%; margin: 20px auto; background: white; border-radius: 8px; overflow: hidden; }
    #pdfModal button { position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; z-index: 10000; font-weight: bold; }
  </style>
</head>
<body>

  <button class="btn-sair" onclick="alert('Sair')">Sair</button>
  <h1>📚 Biblioteca Kugonda</h1>
  <div id="listaLivros">Carregando livros...</div>

  <!-- MODAL DO PDF -->
  <div id="pdfModal">
    <div class="conteudo">
      <button onclick="fecharPDF()">Fechar X</button>
      <iframe id="pdfFrame" src="" width="100%" height="100%" style="border:none;"></iframe>
    </div>
  </div>


  <!-- FIREBASE SDK -->
  <script type="module">
    // 1. COLA AQUI A SUA CONFIG DO FIREBASE
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDWIzYfo-Dyydfp05rF9RaMw6MDhNb_uKE",
  authDomain: "kugonda-online.firebaseapp.com",
  projectId: "kugonda-online",
  storageBucket: "kugonda-online.firebasestorage.app",
  messagingSenderId: "197225463034",
  appId: "1:197225463034:web:05a199b1d6be8ed6355d43"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 2. FUNÇÃO PRA ABRIR E FECHAR O PDF
    window.abrirPDF = function(url) {
      document.getElementById('pdfFrame').src = url;
      document.getElementById('pdfModal').style.display = 'block';
    }

    window.fecharPDF = function() {
      document.getElementById('pdfModal').style.display = 'none';
      document.getElementById('pdfFrame').src = "";
    }

    // 3. BUSCAR LIVROS DO FIRESTORE E LISTAR
    async function carregarLivros() {
      const querySnapshot = await getDocs(collection(db, "livros"));
      const lista = document.getElementById('listaLivros');
      lista.innerHTML = "";

      querySnapshot.forEach((doc) => {
        const livro = doc.data();
        lista.innerHTML += `
          <div class="livro">
            <h3>${livro.title}</h3>
            <p>Classe: ${livro.classe} | ${livro.category}</p>
            <p>Autor: ${livro.author}</p>
            <button class="btn-ler" onclick="abrirPDF('${livro.pdfUrl}')">Ler PDF</button>
          </div>
        `;
      });
    }

    carregarLivros();
  </script>
</body>
</html>
